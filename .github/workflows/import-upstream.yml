name: Import KxSystems/kdb upstream

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-upstream.yml"

permissions:
  contents: write

concurrency:
  group: import-kdb-upstream
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clone upstream and copy source tree
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/KxSystems/kdb.git /tmp/kdb-upstream
          rsync -a --exclude '.git/' --exclude '.github/' /tmp/kdb-upstream/ .
          python3 -c "from pathlib import Path; Path('NOTICE').write_text('This repository is a working copy of KxSystems/kdb.\n\nUpstream source:\n  https://github.com/KxSystems/kdb\n\nCompanion files to kdb+ and q, published by Kx Systems.\nLicensed under the Apache License, Version 2.0.\nSee the LICENSE file in this repository.\n\nkdb+ and q are trademarks of Kx Systems / First Derivatives.\nThis working copy does not grant trademark rights.\n', encoding='utf-8'); Path('README.md').write_text('# KDB\n\nWorking copy of [KxSystems/kdb](https://github.com/KxSystems/kdb) (Apache License 2.0) for development under `eewnah1`.\nOriginal license and attribution are retained. See `NOTICE`, `LICENSE`, and `README.TXT`.\n\nDo not treat this clone as a high-availability upstream. Prefer the official repository for production links.\n', encoding='utf-8')"

      - name: Commit and push imported tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Import KxSystems/kdb working copy with Apache-2.0 attribution retained.'
          git push origin HEAD:main
